name: Documentation Quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown headings and local links
        run: python3 scripts/check_markdown.py

  layer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Disposable database for the storage and browser tests (ADR-0002); never a hosted one.
        # Google's mirror of the official Docker Hub image: Docker Hub rate-limits
        # anonymous pulls from shared runners, and AWS ECR Public's anonymous
        # data limit refused them too.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROFILE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.13.0
      # pnpm comes from Corepack, at the version in package.json's
      # packageManager: no third-party setup action (ADR-0013 §5). Node 26 no
      # longer bundles Corepack, so it is installed on the runner at a fixed version.
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm check
      - run: pnpm build:playground
      # ADR-0012 §4: the minimal host builds and answers; its budget is checked by pnpm check.
      - run: pnpm build:minimal-host
      - run: pnpm smoke:minimal-host
      # The default pages in a real browser, with axe WCAG 2.2 AA checks.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Gate for the `quality` status check that the master ruleset requires of
  # every repository. It passes only when every check above has passed.
  quality:
    needs: [markdown, layer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Documentation and layer checks passed."
