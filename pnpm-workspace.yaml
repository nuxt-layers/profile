# Which dependencies may run install scripts (pnpm 12 fails on any not
# decided here). Theme Manager is built from Git. esbuild's script only
# checks its platform binary, which the @esbuild/* optional dependency
# already supplies, so it stays off, as it was under pnpm 10.
allowBuilds:
  "@nuxt-layers/theme-manager": true
  esbuild: false

# Supply-chain hardening (docs/threat-model.md T10).
# Resolve only versions published at least a day ago; most malicious releases
# are detected and pulled within hours.
minimumReleaseAge: 1440
# Transitive dependencies may come only from the registry, never from Git or
# tarball URLs.
blockExoticSubdeps: true

overrides:
  # GHSA-3g3m-2fjr-6pw4 (moderate) in glob <=14.0.1 and GHSA-g3hv-75wg-m249
  # (moderate) in minimatch <11.0.1, reached only through nuxt -> nitropack
  # (@vercel/nft, archiver) at build time. Their parents accept only glob 13
  # and minimatch 10, which have no patched release. Remove once nitropack's
  # dependencies accept the patched majors.
  glob: ^14.0.2
  minimatch: ^11.0.1
